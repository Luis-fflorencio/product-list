<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh;
            background-color: hsl(13, 31%, 94%);
        }

        @font-face {
            font-family: "ItalicVar";
            src: url('/assets/fonts/RedHatText-Italic-VariableFont_wght.ttf') format(truetype);
        }

        @font-face {
            font-family: "varFont";
            src: url('/assets/fonts/RedHatText-VariableFont_wght.ttf') format(truetype);
        }

        #container {
            display: flex;
            justify-content: start;
            flex-direction: column;
            width: 900px;
            height: 100vh;
        }

        #title {
            margin-top: 20px;
            font-family: varFont;
            color: hsl(14, 65%, 9%);

        }

        #div-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-evenly;
            width: 900px;
            max-width: 80%;
            height: 90vh;
            margin-top: 40px;
            margin-left: 50px;
            /* background-color: hsl(13, 31%, 94%); */
            /* border: 1px solid red; */
        }

        .item {
            /* border: 1px solid red; */
            width: 200px;
            height: 320px;
        }

        .img-items {
            max-width: 200px;
            border-radius: 10px;
        } 

        .button-add {
            width: 150px;
            height: 40px;
            position: relative;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-family: varFont;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid hsl(7, 20%, 60%);
            background-color: hsl(20, 50%, 98%);
        }

        .button-add:hover{
            background-color: hsl(0, 2%, 91%);
        }

        .icon-add {
            margin: 13px 4px 10px 0;
        }

        .button-quanty {
            width: 150px;
            height: 40px;
            position: relative;
            bottom: 25px;
            left: 25px;
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
            background-color: hsl(14, 86%, 42%);
            color: hsl(20, 50%, 98%);
            border-radius: 20px;
            border: 0;
            font-family: varFont;
            font-weight: 500;
        }

        .icons-quanty {
            border: 1.6px solid hsl(20, 50%, 98%);
            height: 22px;
            width: 22px;
            border-radius:100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .espace-description {
            margin-bottom: 5px;
            position: relative;
            bottom: 10px;
            left: 10px;
            font-family: varFont;
        }

        .type {
            font-size: 15px;
            font-weight: 500;
            color: hsl(14, 25%, 72%);
        }

        .name-item {
            font-weight: 460;
        }

        .value {
            font-weight: 700;
            color: hsl(14, 86%, 42%);
        }
        
        #Carrinho {
            height: auto;
            width: 400px;
            position: relative;
            bottom: 100px;
            right: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background-color: hsl(20, 50%, 98%);
            border-radius: 20px;
        }

        #sem-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #title-cart {
            position: relative;
            right: 117px;
            top: 10px;
            font-family: varFont;
            font-weight: 700;
            color: hsl(14, 86%, 42%);
            margin-bottom: 60px;
        }

        #p-cart {
            font-family: varFont;
            color: hsl(14, 25%, 72%);
        }

        #com-item {
           display: none;
           flex-direction: column;
           align-items: center;
           justify-content: space-evenly; 
           /* border: 1px solid red; */
           width: 100%;
           position: relative;
           bottom: 30px;
        }

        #div-items-description {
            width: 100%;
            height: 90px;
            overflow-y: auto;
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .description-add {
            width: 90%;
            display: flex;
            flex-direction: column;
            height: 50px;
            border-bottom: 1.8px solid hsla(0, 0%, 20%, 0.525);
        }

        .name-add {
            font-family: varFont;
            font-weight: 600;
            font-size: 15px;
        }

        .font-value{
            font-family: varFont;
            font-size: 14px;
            font-weight: 650;
        }

        .quanty-add {
            color: hsl(14, 86%, 42%);
        }

        .value {
            color: hsl(14, 86%, 42%);;
        }

        .dolar{
            color: hsl(14, 86%, 42%);
            position: relative;
            left: 13px;
            display: flex;
            flex-direction: row;

        }

        .principal-value-add {
            color: hsla(0, 0%, 2%, 0.489);
        }

        .div-valores {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            max-width: 180px;
            position: relative;
            top: 5px;
            right: 18px;
        }

        .btn-delete{
            width: 16px;
            height:16px;
            border-radius: 8px;
            border: 1px solid hsl(14, 25%, 72%);
            background-color: hsl(20, 50%, 98%);
            position: relative;
            left: 320px;
            bottom: 20px
        }

        .btn-delete:hover {
            background-color: hsl(0, 0%, 93%);
            color: hsl(0, 0%, 93%);
        }

        #div-total {
            width: 90%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin-top: 30px;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            font-family: varFont;
            color: rgb(36, 36, 36);
        }

        #dolar-h2 {
            position: relative;
            left: 105px;
        }

        #div-carbon {
            width: 90%;
            height: 40px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            background-color: hsl(13, 31%, 94%);
            /* border: 1px solid red; */
            border-radius: 10px;
            font-family: varFont;
        }

        #carbon {
            font-weight: bold;
        }

        #btn-confirm {
            width: 90%;
            height: 50px;
            position: relative;
            top: 25px;
            border-radius: 25px;
            border: none;
            font-family: varFont;
            font-weight: 500;
            font-size: 15px;
            background-color: hsl(14, 86%, 42%);
            color: hsl(20, 50%, 98%);
        }

        #btn-confirm:hover {
            background-color: hsl(14, 87%, 37%);            
        }
</style>

</head>
<body>
    
    <div id="container">
        <h1 id="title">Desserts</h1>
        <div id="div-items">
        </div>
    </div>    

    <div id="Carrinho">
        <h3 id="title-cart">Your Cart (<span id="qnt-items">0</span>)</h3>
        
        <div id="sem-item">
            <i id="img-bolo"><img src="/assets/images/illustration-empty-cart.svg" alt=""></i>
            <p id="p-cart">Your added items will appear here</p>
        </div>

        <div id="com-item">
            <div id="div-items-description">
                <!-- <div class="description-add">
                    <p class="name-add">Waffle with Berries</p>
                    <div class="div-valores">    
                        <p class="quanty-add font-value">1x</p>
                        <p class="principal-value-add font-value">@ 6.50</p>
                        <p class="dolar font-value">$<p class=" value font-value">1</p></p>
                    </div>
                    <button class="btn-delete"><i><img src="/assets/images/icon-remove-item.svg"></i></button>
                </div> -->

            </div>    
        
            <div id="div-total">
                <p id="p-total">Order total</p>
                <h2 id="dolar-h2">$<h2 id="total">0</h2></h2>
            </div>
        
            <div id="div-carbon">
                <i id="carbon-icon"><img src="/assets/images/icon-carbon-neutral.svg"></i>
                <p id="p-carbon">This is a <span id="carbon">carbon-neutral</span> delivery</p>
            </div>
        
            <button id="btn-confirm">Confirme Order</button>
        </div>
    </div>

    <script>

        function carregar() {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.querySelector("#div-items");

                    data.map(item => {
                        const Item = document.createElement("div");
                        Item.classList.add("item");

                        const img = document.createElement("img");
                        img.src = item.image.desktop
                        img.classList.add("img-items");

                        //inicio botão add
                        const btnAdd = document.createElement("button");
                        btnAdd.classList.add("button-add");
                        btnAdd.id = item.category;

                        const iCart = document.createElement("i");
                        iCart.classList.add("icon-add");

                        const iconCart = document.createElement("img");
                        iconCart.src = "/assets/images/icon-add-to-cart.svg";

                        const pAdd = document.createElement("p");
                        pAdd.textContent = "Add to Cart";
                        
                        iCart.appendChild(iconCart);
                        btnAdd.appendChild(iCart);
                        btnAdd.appendChild(pAdd);

                        //Fim botão add

                        const pType = document.createElement("p");
                        pType.textContent = item.category;
                        pType.classList.add("type");//espace-description
                        pType.classList.add("espace-description");
                        
                        const pName = document.createElement("p");
                        pName.textContent = item.name;
                        pName.classList.add("name-item");// espace-description
                        pName.classList.add("espace-description");
                        
                        const pPrice = document.createElement("p");
                        pPrice.textContent = `$${item.price}`;
                        pPrice.classList.add("value");//espace-description
                        pPrice.classList.add("espace-description");

                        //inicio do botão Quantidade
                        const btnQuanty = document.createElement("button");
                        btnQuanty.classList.add("button-quanty");
                        btnQuanty.id = item.quanty;
                        // const nome = document.createElement("");

                        const iDecrement = document.createElement("i");
                        iDecrement.classList.add("icon-decrement");//icons-quanty
                        iDecrement.classList.add("icons-quanty");//icons-quanty
                        iDecrement.id = "icon-decrement"

                        const imgMenos = document.createElement("img");
                        imgMenos.src = "/assets/images/icon-decrement-quantity.svg";

                        let pQuanty = document.createElement("p");
                        pQuanty.classList.add("quanty-number");
                        pQuanty.id = "quanty-Number"
                        pQuanty.textContent = "0"

                        const iIncrement = document.createElement("i");
                        iIncrement.classList.add("icon-Increment");// icons-quanty
                        iIncrement.classList.add("icons-quanty");// icons-quanty
                        iIncrement.id = "icon-increment"

                        const imgMais = document.createElement("img");
                        imgMais.src = "/assets/images/icon-increment-quantity.svg";
                        
                        iDecrement.appendChild(imgMenos);
                        iIncrement.appendChild(imgMais);

                        btnQuanty.appendChild(iDecrement);
                        btnQuanty.appendChild(pQuanty);
                        btnQuanty.appendChild(iIncrement);

                        //Fim botão
                        Item.appendChild(img);
                        Item.appendChild(btnAdd);
                        Item.appendChild(btnQuanty);
                        Item.appendChild(pType);
                        Item.appendChild(pName);
                        Item.appendChild(pPrice);

                        container.appendChild(Item)
                        
                        btnAdd.addEventListener("click", () => {
                            btnQuanty.style.display = "flex";
                            btnAdd.style.display = "none"
                            const semItem = document.querySelector("#sem-item");
                            const comItem = document.querySelector("#com-item");
                            semItem.style.display = "none";
                            comItem.style.display = "flex";


                            const descriptionPai = document.querySelector("#div-items-description") 

                            const descriptionCard = document.createElement("div");
                            descriptionCard.classList.add("description-add");
                            descriptionCard.id = "descriptionCard"

                            const nameDescription = document.createElement("p");
                            nameDescription.classList.add("name-add");
                            nameDescription.textContent = pName.textContent;

                            const divValues = document.createElement("div");
                            divValues.classList.add("div-valores")
                            
                            let quantyDescription = document.createElement("p");
                            quantyDescription.classList.add("quanty-add");
                            quantyDescription.classList.add("font-value");
                            quantyDescription.textContent = `x0`;

                            const originalValue = document.createElement("p");
                            originalValue.classList.add("principal-value-add");
                            originalValue.classList.add("font-value");
                            originalValue.textContent = pPrice.textContent;
                            
                            let totalItem = document.createElement("p");
                            totalItem.classList.add("value");
                            totalItem.classList.add("font-value");
                            totalItem.textContent = `0`;

                            let dolar = document.createElement("p");
                            dolar.textContent = "$";
                            dolar.classList.add("dolar");
                            dolar.classList.add("font-value")
                            dolar.appendChild(totalItem)


                            const btnDelete = document.createElement("button");
                            btnDelete.classList.add("btn-delete");

                            const iDelete = document.createElement("i");

                            const imgDelete = document.createElement("img");
                            imgDelete.src = "/assets/images/icon-remove-item.svg";


                            divValues.appendChild(quantyDescription);
                            divValues.appendChild(originalValue);
                            // divValues.appendChild(totalItem);
                            divValues.appendChild(dolar);

                            iDelete.appendChild(imgDelete);
                            btnDelete.appendChild(iDelete);

                            descriptionCard.appendChild(nameDescription);
                            descriptionCard.appendChild(divValues);
                            descriptionCard.appendChild(btnDelete);

                            descriptionPai.appendChild(descriptionCard);
                            
                            iIncrement.addEventListener("click", () => {
                                pQuanty.textContent = Number(pQuanty.textContent) + 1;
                                quantyDescription.textContent = `x${pQuanty.textContent}`;
                                const calcTotal = Number(pQuanty.textContent) * item.price;
                                totalItem.textContent = calcTotal;
                                const Total = document.querySelector("#total");
                                const calc = Number(Total.textContent) + item.price;
                                Total.textContent = calc;
                                const titleQnt = document.querySelector("#qnt-items")
                                titleQnt.textContent = pQuanty.textContent;
                            })

                            iDecrement.addEventListener("click", () => {
                                if (Number(pQuanty.textContent) >= 1){
                                    pQuanty.textContent = Number(pQuanty.textContent) - 1;
                                    quantyDescription.textContent = `x${pQuanty.textContent}`;                                                                   
                                    totalItem.textContent = Number(totalItem.textContent) - item.price;                                      
                                    const Total = document.querySelector("#total");
                                    const calc = Number(Total.textContent) - item.price;
                                    Total.textContent = calc;
                                    const titleQnt = document.querySelector("#qnt-items")
                                    titleQnt.textContent = pQuanty.textContent;
                                }else{
                                    pQuanty.textContent = 0;
                                    quantyDescription.textContent = `x${pQuanty.textContent}`
                                    totalItem.textContent = 0
                                }
                                // totalItem.textContent = `$${Number(totalItem.textContent) / Number(pQuanty.textContent)}`;
                            })
                            // btnDelete.addEventListener("click", () => {
                            //     // 1. Remove o card
                            //     descriptionCard.remove();

                            //     // 2. Zera total
                            //     const Total = document.querySelector("#total");
                            //     Total.textContent = 0;

                            //     // 3. Zera contador do título
                            //     const titleQnt = document.querySelector("#qnt-items");
                            //     titleQnt.textContent = 0;

                            //     // 4. Volta para "sem item"
                            //     const semItem = document.querySelector("#sem-item");
                            //     const comItem = document.querySelector("#com-item");

                            //     semItem.style.display = "none";
                            //     comItem.style.display = "flex";

                            //     // 5. Reset do produto
                            //     pQuanty.textContent = 0;
                            //     btnQuanty.style.display = "none";
                            //     btnAdd.style.display = "flex";
                            // });


                            // btnDelete.addEventListener("click", () => {
                            // descriptionCard.remove();

                            // // opcional: reset visual
                            // btnQuanty.style.display = "none";
                            // btnAdd.style.display = "flex";
                            // });
                        })
                    })
                })
        }



        /*            
        <div id="div-items-description">
            <div class="description-add">
                <p class="name-add">Waffle with Berries</p>
                <div class="div-valores">    
                    <p class="quanty-add font-value">1x</p>
                    <p class="principal-value-add font-value">@ 6.50</p>
                    <p class=" value font-value">$6.50</p>
                </div>
                <button class="btn-delete"><i><img src="/assets/images/icon-remove-item.svg"></i></button>
            </div>
        </div> */
        carregar()
    </script>
</body>
</html>
